#student-dashboard-sample *{box-sizing:border-box}
#student-dashboard-sample [hidden]{display:none!important}
#student-dashboard-sample h1,#student-dashboard-sample h2,#student-dashboard-sample p,#student-dashboard-sample dl,#student-dashboard-sample dd{margin:0}
#student-dashboard-sample header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:16px 28px;border-bottom:1px solid var(--line)}
#student-dashboard-sample .brand{font-weight:800;font-size:17px}
#student-dashboard-sample .identity{text-align:right;font-weight:600}
#student-dashboard-sample small{display:block;font-size:12px;color:var(--muted);font-weight:500}
#student-dashboard-sample main{padding:28px;max-width:1080px;margin:auto}
#student-dashboard-sample h1{font-size:28px;line-height:1.25;letter-spacing:-.025em}
#student-dashboard-sample h2{font-size:16px;line-height:1.4;overflow-wrap:anywhere}
#student-dashboard-sample .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0;border-bottom:1px solid var(--line);padding-bottom:12px}
#student-dashboard-sample button,#student-dashboard-sample select{font:inherit;min-height:44px;background:white;color:var(--ink);padding:8px 12px;border:1px solid var(--line);border-radius:8px}
#student-dashboard-sample button:hover{background:var(--fill)}
#student-dashboard-sample button[aria-pressed=true]{background:#eff6ff;color:var(--blue);border-color:#bad2ef;font-weight:700}
#student-dashboard-sample button.primary{background:var(--blue);border-color:var(--blue);color:white;font-weight:700}
#student-dashboard-sample button:focus-visible,#student-dashboard-sample select:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
#student-dashboard-sample .toolbar{display:flex;align-items:end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}
#student-dashboard-sample label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}
#student-dashboard-sample .events{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
#student-dashboard-sample article{border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;align-content:start}
#student-dashboard-sample .event-heading{display:flex;justify-content:space-between;align-items:start;gap:8px;flex-wrap:wrap}
#student-dashboard-sample .badge{font-size:12px;padding:3px 9px;border-radius:20px;background:#ecfdf5;color:#065f46;font-weight:700}
#student-dashboard-sample .badge.soon{background:#fff5dd;color:#714500}
#student-dashboard-sample .badge.closed{background:var(--fill);color:var(--muted)}
#student-dashboard-sample dt{font-size:12px;color:var(--muted)}
#student-dashboard-sample dd{font-weight:600}
#student-dashboard-sample dl{display:grid;gap:8px}
#student-dashboard-sample article footer{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:12px}
#student-dashboard-sample .note{margin-top:16px;color:var(--muted);font-size:12px}
#student-dashboard-sample{background:#f5f7fb}
#student-dashboard-sample header{background:#1458a8;color:#fff;border-color:#377bc7;padding-inline:clamp(16px,4vw,40px)}
#student-dashboard-sample header small{color:#e9f2ff}
#student-dashboard-sample .nav-tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#student-dashboard-sample header .theme-toggle{background:transparent;color:#fff;border-color:#a6c9f1;white-space:nowrap}
#student-dashboard-sample header .theme-toggle:hover,#student-dashboard-sample header .theme-toggle[aria-pressed=true]{background:#e8f2ff;color:#143b68;border-color:#e8f2ff}
#student-dashboard-sample header .theme-toggle:focus-visible{outline-color:white}
#student-dashboard-sample .brand{display:flex;align-items:center;gap:10px}
#student-dashboard-sample .brand img{width:37px;height:37px;object-fit:contain}
#student-dashboard-sample .identity{display:flex;align-items:center;gap:10px}
#student-dashboard-sample .avatar{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#eaf1fc;color:var(--blue);font-size:12px}
#student-dashboard-sample .showcase{background:#11263f;color:white;background-image:linear-gradient(90deg,rgba(11,29,52,.97),rgba(11,29,52,.89) 40%,rgba(11,29,52,.57) 73%,rgba(11,29,52,.33)),var(--campus-photo);background-size:cover;background-position:center 45%;padding:clamp(28px,5vw,58px) clamp(16px,5vw,52px) 20px}
#student-dashboard-sample .showcase h1{font-size:clamp(30px,5vw,52px);max-width:16ch;margin-top:12px}
#student-dashboard-sample .showcase p{max-width:47ch;color:#e4ecf7;margin-top:12px}
#student-dashboard-sample .feature-meta{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:13px;font-weight:600}
#student-dashboard-sample .feature-action{margin-top:20px}
#student-dashboard-sample .feature-controls{display:flex;justify-content:end;align-items:center;gap:10px;margin-top:12px;color:#e4ecf7;font-size:12px}
#student-dashboard-sample .feature-controls button{min-width:44px;background:#162e49;color:white;border-color:#64809f}
#student-dashboard-sample .section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
#student-dashboard-sample .section-heading h2{font-size:24px;letter-spacing:-.02em}
#student-dashboard-sample .tabs{margin:0;padding:4px;background:#e9eef5;border:0;border-radius:10px;gap:4px}
#student-dashboard-sample .tabs button{background:transparent;border-color:transparent}
#student-dashboard-sample .tabs button[aria-pressed=true]{background:white;border-color:#cbd9ea}
#student-dashboard-sample article{padding:0;overflow:hidden;background:white;gap:0}
#student-dashboard-sample .event-banner{min-height:115px;padding:14px 16px;display:flex;justify-content:space-between;align-items:start;gap:8px;flex-wrap:wrap;background:#203650;background-image:linear-gradient(180deg,rgba(13,33,56,.7),rgba(13,33,56,.1)),var(--campus-photo);background-size:cover;background-position:center 30%;color:white;font-weight:700}
#student-dashboard-sample .event-banner.workshop{background-position:center 65%}
#student-dashboard-sample .event-body{padding:16px;display:grid;gap:12px}
#student-dashboard-sample dialog{width:min(440px,calc(100% - 28px));max-height:calc(100dvh - 28px);overflow:auto;margin:auto;padding:20px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:white}
#student-dashboard-sample dialog::backdrop{background:rgb(20 44 72 / 45%)}
#student-dashboard-sample dialog p{margin-top:12px}
#student-dashboard-sample dialog footer{display:flex;gap:8px;justify-content:end;flex-wrap:wrap;margin-top:16px}
@media(max-width:620px){#student-dashboard-sample main,#student-dashboard-sample header{padding:18px 14px}#student-dashboard-sample .events{grid-template-columns:1fr}#student-dashboard-sample .identity{text-align:left}#student-dashboard-sample select{font-size:16px}}
#student-dashboard-sample[data-theme="dark"]{--ink:#eaf1fc;--muted:#b3c3d9;--line:#384c67;--fill:#233751;background:#0d1829;color-scheme:dark}
#student-dashboard-sample[data-theme="dark"] header{background:#174e97;border-color:#3973b6}
#student-dashboard-sample[data-theme="dark"] article,#student-dashboard-sample[data-theme="dark"] dialog{background:#14243a}
#student-dashboard-sample[data-theme="dark"] button,#student-dashboard-sample[data-theme="dark"] select{background:#1a2d47}
#student-dashboard-sample[data-theme="dark"] button:hover{background:#293e59}
#student-dashboard-sample[data-theme="dark"] .tabs{background:#17273d;border:1px solid var(--line)}
#student-dashboard-sample[data-theme="dark"] .tabs button{background:transparent}
#student-dashboard-sample[data-theme="dark"] .tabs button[aria-pressed=true]{background:#294871;color:#f1f6ff;border-color:#5679a7}
#student-dashboard-sample[data-theme="dark"] button.primary{background:#8bbafa;color:#0b2443;border-color:#8bbafa}
#student-dashboard-sample[data-theme="dark"] button.primary:hover{background:#a4cafa}
#student-dashboard-sample[data-theme="dark"] .badge{background:#163f34;color:#b9f6db}
#student-dashboard-sample[data-theme="dark"] .badge.soon{background:#503b1b;color:#ffdea1}
#student-dashboard-sample[data-theme="dark"] .badge.closed{background:#31415a;color:#e4ecfa}
#student-dashboard-sample[data-theme="dark"] button:focus-visible,#student-dashboard-sample[data-theme="dark"] select:focus-visible{outline-color:#a4cafa}
#student-dashboard-sample[data-theme="dark"] header .theme-toggle[aria-pressed=true]{background:#e8f2ff;color:#143b68;border-color:#e8f2ff}
#student-dashboard-sample[data-theme="dark"] header .theme-toggle:hover{background:#d2e6ff;color:#143b68}
</style>

lass="avatar" aria-hidden="true">MD</span><div>Mikaela Dizon<small>2024-10437</small></div></div><button type="button" id="student-dashboard-theme" class="theme-toggle" aria-pressed="true">Dark mode</button></div></header>
 <section class="showcase" aria-label="Featured campus events">
  <div aria-live="polite"><h1 id="student-feature-title">Campus Research Forum</h1><p><span id="student-feature-status" class="badge">Registration open</span></p><p id="student-feature-description">Hear student teams present their research and join a discussion with faculty mentors.</p><p id="student-feature-meta" class="feature-meta"></p></div>
  <button type="button" id="student-feature-action" class="primary feature-action">View event &amp; register</button>
  <div class="feature-controls"><span id="student-feature-count">1 of 2</span><button type="button" id="student-feature-prev" aria-label="Previous featured event">←</button><button type="button" id="student-feature-next" aria-label="Next featured event">→</button></div>
 </section>
 <main>
  <div class="section-heading"><h2 id="student-dashboard-title">Campus events</h2><nav class="tabs" aria-label="Student event views"><button type="button" data-view="catalog" aria-pressed="true">Available events</button><button type="button" data-view="registered" aria-pressed="false">My registered events</button></nav></div>
  <div class="toolbar"><p id="student-dashboard-count" role="status"></p><div id="student-dashboard-filter"><label for="student-dashboard-category">Category</label><select id="student-dashboard-category"><option value="">All categories</option><option>Seminar</option><option>Workshop</option><option>Campus activity</option></select></div></div>
  <div class="events" id="student-dashboard-events" aria-labelledby="student-dashboard-title"></div>
  <p class="note">Design sample · Fictional events and passes</p>
 </main>
 <dialog id="student-dashboard-dialog" aria-labelledby="student-dashboard-dialog-title"><h2 id="student-dashboard-dialog-title"></h2><p id="student-dashboard-dialog-detail"></p><footer><button type="button" id="student-dashboard-close">Close</button><button type="button" id="student-dashboard-confirm" class="primary" hidden></button></footer></dialog>
</div>
<script>
(() => {
 const root = document.getElementById('student-dashboard-sample');
 const find = selector => root.querySelector(selector);
 const themeToggle = find('#student-dashboard-theme');
 themeToggle.addEventListener('click', () => {
  const dark = root.dataset.theme !== 'dark';
  root.dataset.theme = dark ? 'dark' : 'light';
  themeToggle.setAttribute('aria-pressed', String(dark));
 });
 const events = [
  { title:'Campus Research Forum', category:'Seminar', date:'Nov 30, 2026 · 9:00 AM–12:00 PM', venue:'San Bartolome · Main Auditorium', status:'Open', registration:'Registration closes Nov 29 · 42 seats left', description:'Hear student teams present their research and join a discussion with faculty mentors.', sponsor:'Student Research Council' },
  { title:'Portfolio and Interview Lab', category:'Workshop', date:'Dec 5, 2026 · 1:00–4:00 PM', venue:'Batasan · Computer Lab 2', status:'Soon', registration:'Registration opens Nov 26', description:'Bring a draft portfolio for a guided review and practice interview.' },
  { title:'Campus Volunteer Orientation', category:'Campus activity', date:'Nov 27, 2026 · 10:00–11:30 AM', venue:'San Francisco · Seminar Room', status:'Closed', registration:'Registration closed Nov 22', description:'Meet the student volunteers and review the schedule for outreach activities.' },
  { title:'Design and Technology Showcase', category:'Campus activity', date:'Dec 2, 2026 · 10:00 AM–2:00 PM', venue:'San Bartolome · Exhibit Hall', status:'Open', registration:'Registration closes Dec 1', description:'Explore prototypes from student teams.', pass:'TCK-2107-00341', canCancel:true },
  { title:'Career Readiness Seminar', category:'Seminar', date:'Nov 20, 2026 · 9:00–11:00 AM', venue:'Batasan · Multipurpose Hall', status:'Closed', registration:'Event completed', description:'Career planning and interview preparation.', pass:'TCK-2108-00342', checkedIn:true }
 ];
 const dialog = find('#student-dashboard-dialog');
 const confirm = find('#student-dashboard-confirm');
 const category = find('#student-dashboard-category');
 let selectedView = 'catalog';
 let onConfirm;
 const featured = events.slice(0,2);
 let featureIndex = 0;
 function add(parent, tag, value, css) {
  const element = document.createElement(tag);
  element.textContent = value;
  if (css) element.className = css;
  parent.append(element);
  return element;
 }
 function details(title, detail, action, callback) {
  find('#student-dashboard-dialog-title').textContent = title;
  find('#student-dashboard-dialog-detail').textContent = detail;
  confirm.hidden = !action;
  confirm.textContent = action || '';
  onConfirm = callback;
  dialog.showModal();
 }
 function viewEvent(event) {
  details(event.title, event.description + (event.sponsor ? ' Hosted by ' + event.sponsor + '.' : '') + ' ' + event.date + ' · ' + event.venue + '. ' + event.registration + '.', event.status === 'Open' ? 'Preview registration' : '', () => {
   find('#student-dashboard-dialog-detail').textContent = 'The registration flow asks for your year level, section, and confirmation.';
   confirm.hidden = true;
  });
 }
 function renderFeature() {
  const event = featured[featureIndex];
  const status = find('#student-feature-status');
  status.textContent = event.status === 'Open' ? 'Registration open' : 'Opens soon';
  status.className = event.status === 'Open' ? 'badge' : 'badge soon';
  find('#student-feature-title').textContent = event.title;
  find('#student-feature-description').textContent = event.description;
  const meta = find('#student-feature-meta');
  meta.replaceChildren();
  add(meta,'span',event.date + ' PHT');
  add(meta,'span',event.venue);
  find('#student-feature-action').textContent = event.status === 'Open' ? 'View event & register' : 'View event';
  find('#student-feature-count').textContent = (featureIndex + 1) + ' of ' + featured.length;
 }
 function moveFeature(step) {
  featureIndex = (featureIndex + step + featured.length) % featured.length;
  renderFeature();
 }
 function render() {
  const registered = selectedView === 'registered';
  const filter = category.value;
  const rows = events.filter(event => registered ? Boolean(event.pass) : !event.pass && (!filter || event.category === filter));
  const catalogOrder = { Open:0, Soon:1, Closed:2 };
  if (!registered) rows.sort((a,b) => catalogOrder[a.status] - catalogOrder[b.status]);
  const list = find('#student-dashboard-events');
  list.replaceChildren();
  find('#student-dashboard-title').textContent = registered ? 'My registered events' : 'Campus events';
  find('#student-dashboard-filter').hidden = registered;
  find('#student-dashboard-count').textContent = rows.length ? rows.length + (registered ? ' registered events' : ' eligible events') : registered ? 'No active registrations' : 'No eligible events in this category';
  for (const event of rows) {
   const card = add(list, 'article', '');
   const banner = add(card, 'div', '', event.category === 'Workshop' ? 'event-banner workshop' : 'event-banner');
   add(banner, 'span', event.category);
   const label = registered ? event.checkedIn ? 'Checked in' : 'Registered' : event.status === 'Soon' ? 'Opens soon' : event.status;
   add(banner, 'span', label, 'badge ' + (registered ? '' : event.status.toLowerCase()));
   const body = add(card,'div','','event-body');
   add(body, 'h2', event.title);
   const facts = add(body,'dl','');
   for (const [term,value] of [['Date and time (PHT)',event.date],['Venue',event.venue],[registered ? 'Ticket reference' : 'Registration',registered ? event.pass : event.registration]]) {
    const fact = add(facts,'div','');
    add(fact,'dt',term);
    add(fact,'dd',value);
   }
   const footer = add(body,'footer','');
   const view = add(footer,'button',registered ? 'View pass' : 'View event',event.status === 'Open' || registered ? 'primary' : '');
   view.type = 'button';
   view.addEventListener('click', () => {
    if (registered) details('Event pass', event.title + ' · ' + event.pass + ' · ' + label);
    else viewEvent(event);
   });
   if (registered && event.canCancel) {
    const cancel = add(footer,'button','Cancel registration');
    cancel.type = 'button';
    cancel.addEventListener('click', () => details('Cancel registration?', event.title + ' will return to Campus events in this preview.', 'Confirm cancellation', () => {
     event.pass = null;
     dialog.close();
     render();
     root.querySelector('[data-view="registered"]').focus();
    }));
   }
  }
 }
 root.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => {
  selectedView = button.dataset.view;
  root.querySelectorAll('[data-view]').forEach(tab => tab.setAttribute('aria-pressed', String(tab === button)));
  render();
 }));
 category.addEventListener('change',render);
 find('#student-dashboard-close').addEventListener('click', () => dialog.close());
 confirm.addEventListener('click', () => onConfirm?.());
 find('#student-feature-prev').addEventListener('click', () => moveFeature(-1));
 find('#student-feature-next').addEventListener('click', () => moveFeature(1));
 find('#student-feature-action').addEventListener('click', () => viewEvent(featured[featureIndex]));
 renderFeature();
 render();
})();
</script>
